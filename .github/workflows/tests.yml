name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: linux (supported)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Two tests need a real herdr:
      #   test_manifest.sh   … has `herdr plugin link` validate the manifest
      #   test_apply_real.sh … exercises the validation gate through the real
      #                        `herdr config check`
      # herdr ships as a single binary, so fetching it onto PATH is enough.
      # test_apply_real.sh skips itself when herdr is missing, so a failure in
      # this step would still leave the suite green — check the fetch explicitly.
      - name: install herdr
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/herdr \
            https://github.com/herdrdev/herdr/releases/latest/download/herdr-linux-x86_64
          chmod +x /usr/local/bin/herdr
          herdr --version

      - name: dependencies
        run: |
          set -euo pipefail
          jq --version
          python3 --version   # 3.11+ — tests/test_rows.sh uses tomllib

      - name: run tests
        run: bash tests/run.sh

  macos:
    # Ported. This job is required, so a macOS regression stops here.
    # Only two BSD-userland incompatibilities actually bit us:
    #   wc -l pads its output with leading spaces (all 5 failures were this)
    #   date's %N is a GNU extension and does not expand
    # Static analysis had also flagged mktemp -p, but it works on macOS
    # (false positive). Reading the code finds GNU-only *flags*; differences in
    # the *output format* of the same command only show up once you run it.
    name: macos (supported)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: install herdr
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/herdr \
            https://github.com/herdrdev/herdr/releases/latest/download/herdr-macos-aarch64
          chmod +x /usr/local/bin/herdr
          herdr --version

      - name: dependencies
        run: |
          set -euo pipefail
          command -v jq >/dev/null || brew install jq
          jq --version
          python3 --version

      - name: run tests
        run: bash tests/run.sh

      # Collect what breaks on BSD into one screen — this doubles as the
      # porting to-do list.
      - name: portability probe
        if: always()
        run: |
          echo "--- mktemp -d -p ---"
          mktemp -d -p /tmp 2>&1 | head -2 || true
          echo "--- date +%s%3N ---"
          date +%s%3N 2>&1 | head -2 || true
          echo "--- chmod --reference ---"
          touch /tmp/a /tmp/b
          chmod --reference=/tmp/a /tmp/b 2>&1 | head -2 || true
          echo "--- bash version (macOS ships 3.2) ---"
          bash --version | head -1
